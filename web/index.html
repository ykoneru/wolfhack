<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <meta name="description" content="Estimated activity across Wake County and the best time to go." />
    <title>FlowMap · Best time to go</title>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="/">FLOWMAP</a>
      <p class="tagline">Know when to leave.</p>
      <form id="search-form" role="search">
        <label class="sr" for="search">Search destination</label>
        <input id="search" type="search" placeholder="Search a destination" autocomplete="off" />
        <div id="search-results" class="search-results"></div>
      </form>
      <a class="method-link" href="/method.html">Method</a>
    </header>
    <div class="toolbar">
      <label for="hour">Time <output id="hour-label" for="hour">5:00 PM</output></label>
      <input id="hour" type="range" min="8" max="22" value="17" step="1" />
      <button id="play" type="button">Play</button>
      <p class="scope">Typical weekday · Wake County · estimated activity, not a live crowd count</p>
    </div>
    <div class="tripbar">
      <p id="origin-label">From NC State</p>
      <button id="locate" type="button">I am here</button>
      <button id="set-start" type="button">Set start on map</button>
      <button class="demo" data-place="The Village Deli" type="button">Village Deli</button>
      <button class="demo" data-place="Spring Rolls Asian Bistro and Sushi Bar" type="button">Spring Rolls</button>
      <button class="demo" data-place="North Hills Club" type="button">North Hills Club</button>
    </div>
    <main>
      <div id="map"></div>
      <aside id="panel">
        <div class="route-card" id="route-card" hidden>
          <p class="eyebrow">ROUTE</p>
          <p id="route-summary">—</p>
          <p id="leave-by"></p>
        </div>
        <div id="compare" class="compare"></div>
        <p id="shift"></p>
        <p class="eyebrow" id="place-category">DESTINATION</p>
        <h1 id="place-name">Choose a place</h1>
        <p id="place-hours" class="muted"></p>
        <p class="eyebrow">ESTIMATED ACTIVITY</p>
        <p id="current-score" class="score">—</p>
        <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
        <p id="current-category"></p>
        <div class="best">
          <p class="eyebrow">BEST TIME TO GO</p>
          <p id="best-time">—</p>
          <p id="best-score" class="muted"></p>
        </div>
        <p id="explanation"></p>
        <div class="factors" id="factors"></div>
        <div id="chart" class="chart" aria-label="Estimated activity by hour"></div>
        <p id="series-source" class="muted"></p>
        <p id="context" class="muted"></p>
        <div class="window">
          <label>Earliest <input id="earliest" type="number" min="8" max="22" value="16" /></label>
          <label>Latest <input id="latest" type="number" min="8" max="22" value="21" /></label>
          <label>Visit minutes <input id="minimum" type="number" min="15" max="180" value="45" /></label>
        </div>
        <div class="actions">
          <button id="hear" type="button">Hear why</button>
          <button id="save-plan" type="button" hidden>Save this plan</button>
        </div>
        <p id="plan-note" class="muted"></p>
        <div class="student">
          <p class="eyebrow">BEFORE CLASS</p>
          <label>Back by <input id="class-hour" type="number" min="9" max="22" value="14" /></label>
          <label>Errand
            <select id="errand">
              <option value="grocery">Groceries</option>
              <option value="restaurant">Food</option>
              <option value="gym">Gym</option>
              <option value="cafe">Coffee</option>
            </select>
          </label>
          <button id="plan-errand" type="button">Plan the errand</button>
          <p id="errand-note" class="muted"></p>
        </div>
        <ul class="legend" aria-label="Activity colors">
          <li><span class="swatch" style="background:#8fbfa8"></span> Quiet under 26</li>
          <li><span class="swatch" style="background:#b7c98a"></span> Light</li>
          <li><span class="swatch" style="background:#e6c35c"></span> Moderate</li>
          <li><span class="swatch" style="background:#e07a3d"></span> Busy</li>
          <li><span class="swatch" style="background:#c23b3b"></span> Very busy</li>
        </ul>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
